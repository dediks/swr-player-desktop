name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe"
          )
          $found = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Installing Inno Setup 6 via Chocolatey..."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Found Inno Setup compiler: $found"
          }

      - name: Build desktop app and Inno Setup installer
        shell: pwsh
        run: |
          python packaging/build_desktop.py --clean --fetch-ffmpeg --install-deps --installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\SwarariaAudioLab_Setup.exe")) {
            Write-Error "Missing dist\SwarariaAudioLab_Setup.exe"
            exit 1
          }
          if (-not (Test-Path "dist\SwarariaAudioLab_Setup.exe.sha256")) {
            Write-Error "Missing dist\SwarariaAudioLab_Setup.exe.sha256"
            exit 1
          }

      - name: Upload installer build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwarariaAudioLab-Windows-Installer
          path: |
            dist/SwarariaAudioLab_Setup.exe
            dist/SwarariaAudioLab_Setup.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $shaLine = (Get-Content "dist\SwarariaAudioLab_Setup.exe.sha256" -Raw).Trim()

          $notesLines = @(
            "## SWARARIA AUDIO LAB $tag",
            "",
            "### Instalasi Windows",
            '1. Unduh `SwarariaAudioLab_Setup.exe` pada bagian **Assets** di bawah.',
            '2. Jalankan wizard instalasi (runtime Python, UI, `yt-dlp`, dan FFmpeg sudah terpaket).',
            "",
            '> **Catatan Windows Defender SmartScreen (`Unknown publisher`):**',
            '> Jika muncul jendela *"Windows protected your PC"*, klik **`More info`** -> **`Run anyway`**.',
            ">",
            "> **SHA-256:**",
            '> ```',
            "> $shaLine",
            '> ```'
          )

          $generated = gh api "repos/$repo/releases/generate-notes" -f "tag_name=$tag" --jq ".body" 2>$null
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($generated)) {
            $notesLines += @("", "---", "", $generated.Trim())
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value ($notesLines -join "`n") -Encoding UTF8

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist\SwarariaAudioLab_Setup.exe" "dist\SwarariaAudioLab_Setup.exe.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag "dist\SwarariaAudioLab_Setup.exe" "dist\SwarariaAudioLab_Setup.exe.sha256" `
              --title "SWARARIA AUDIO LAB $tag" `
              --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
